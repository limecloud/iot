[package]
name = "limeiot-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
limeiot-core.workspace = true
limeiot-android-tv = { path = "../../adapters/android-tv" }
limeiot-dlna = { path = "../../adapters/dlna" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
rumqttc.workspace = true
axum = "0.7.9"
rusqlite = { version = "0.31.0", features = ["bundled"] }
futures-util = "0.3.31"
subtle = "2.6.1"
tower-http = { version = "0.6.8", features = ["fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17.14"
base64 = "0.22.1"
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.11"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
