# 可选同机CPU推理服务；使用预先准备的模型缓存，不发布端口或赋予设备权限。
services:
  gateway:
    environment:
      LIMEIOT_OLLAMA_MODEL: ${LIMEIOT_OLLAMA_MODEL:?}
      LIMEIOT_OLLAMA_URL: http://ollama:11434
      LIMEIOT_OLLAMA_CA_FILE: ""
    networks:
      inference: {}
  ollama:
    extends:
      file: compose.ollama-service.yaml
      service: ollama
    networks: [inference]
networks:
  inference:
    internal: true
