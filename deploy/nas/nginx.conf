pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
stream {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream device_broker {
        zone device_broker 64k;
        server gateway:8883 resolve;
    }
    server {
        listen 8883;
        proxy_pass device_broker;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    upstream home_gateway {
        zone home_gateway 64k;
        server gateway:17880 resolve;
    }
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;
        location ~ "^/artifacts/(?<artifact_id>artifact-[0-9a-f]{64})/(firmware\.bin|manifest\.json)$" {
            root /firmware;
            disable_symlinks on;
            if (!-f /firmware/artifacts/$artifact_id/published.json) { return 404; }
            limit_except GET { deny all; }
            try_files $uri =404;
            types { application/octet-stream bin; application/json json; }
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location /artifacts/ { return 404; }
        location / {
            proxy_pass http://home_gateway;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_hide_header X-Powered-By;
        }
    }
}
