name: limeiot
services:
  gateway:
    image: limeiot/local:0.6.0
    build:
      context: ../..
      dockerfile: deploy/nas/Dockerfile
    user: "${LIMEIOT_UID:?}:${LIMEIOT_GID:?}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=32m"]
    environment:
      LIMEIOT_PUBLIC_ORIGIN: ${LIMEIOT_PUBLIC_ORIGIN:?}
    volumes:
      - ${LIMEIOT_STATE_DIR:?}/data:/data
      - ${LIMEIOT_STATE_DIR:?}/config:/config:ro
      - ${LIMEIOT_STATE_DIR:?}/secrets:/secrets:ro
      - ${LIMEIOT_STATE_DIR:?}/broker-tls:/broker-tls:ro
    networks: [local]
    stop_grace_period: 15s
  edge:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    user: "${LIMEIOT_UID:?}:${LIMEIOT_GID:?}"
    command: [nginx, -c, /etc/limeiot/nginx.conf, -g, "daemon off;"]
    entrypoint: []
    ports:
      - "${LIMEIOT_BIND_HOST:-0.0.0.0}:${LIMEIOT_HTTPS_PORT:?}:8443"
      - "${LIMEIOT_BIND_HOST:-0.0.0.0}:${LIMEIOT_MQTT_TLS_PORT:-8883}:8883"
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=32m"]
    volumes:
      - ./nginx.conf:/etc/limeiot/nginx.conf:ro
      - ${LIMEIOT_STATE_DIR:?}/tls:/tls:ro
      - ${LIMEIOT_STATE_DIR:?}/firmware:/firmware:ro
    networks: [local, ingress]
  lamp:
    image: limeiot/local:0.6.0
    profiles: [simulation]
    user: "${LIMEIOT_UID:?}:${LIMEIOT_GID:?}"
    command: [simulator, device-lamp]
    network_mode: service:gateway
    depends_on:
      gateway: {condition: service_healthy, restart: true}
    environment:
      LIMEIOT_PUBLIC_ORIGIN: ${LIMEIOT_PUBLIC_ORIGIN:?}
    volumes:
      - ${LIMEIOT_STATE_DIR:?}/data:/data
      - ${LIMEIOT_STATE_DIR:?}/secrets:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck: {disable: true}
  button:
    extends: lamp
    command: [simulator, device-button]
    stdin_open: true
networks:
  local:
    internal: true
  ingress: {}
