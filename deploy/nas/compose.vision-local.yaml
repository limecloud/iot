# 视觉专用同机Ollama，复用CPU/内存/权限限制，无需启用文字规则生成。
services:
  gateway:
    environment:
      LIMEIOT_VISION_URL: http://vision:11434
      LIMEIOT_VISION_MODEL: ${LIMEIOT_VISION_MODEL:?}
      LIMEIOT_VISION_CA_FILE: ""
    networks:
      vision: {}
  vision:
    extends:
      file: compose.ollama-service.yaml
      service: ollama
    networks: [vision]
networks:
  vision:
    internal: true
