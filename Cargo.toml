[workspace]
members = ["gateway/crates/core", "gateway/crates/runtime", "tools/simulator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_jcs = "0.1.0"
chrono = { version = "0.4.43", features = ["serde"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
tokio = { version = "1.49.0", features = ["full"] }
rumqttc = { version = "0.25.1", default-features = false }
limeiot-core = { path = "gateway/crates/core" }
